# Ambiente de desenvolvimento do Wolf Quant Fund (Python 3.12 + uv).
# Uso: docker compose up -d app  |  docker compose run --rm test  |  docker compose run --rm lint
name: wolf-quant-fund

x-app: &app
  build:
    context: .
  image: wolf-quant-fund:dev
  working_dir: /app
  init: true
  environment:
    WQF_ENV: ${WQF_ENV:-development}
    WQF_DATA_DIR: ${WQF_DATA_DIR:-/app/data}
  volumes:
    # Repositório montado: edições locais valem no container sem rebuild.
    - .:/app
    # Cache do uv compartilhado entre execuções (ex.: uv run --with jupyterlab).
    - uv-cache:/root/.cache/uv

services:
  # Sandbox de desenvolvimento: `docker compose up -d app` e depois `docker compose exec app <cmd>`.
  app:
    <<: *app
    ports:
      # Reservado para o Jupyter opcional; veja o README.
      - "${WQF_JUPYTER_PORT:-8888}:8888"

  # Mesmos checks do CI (.github/workflows/ci.yml).
  test:
    <<: *app
    command: ["uv", "run", "pytest", "-q"]

  lint:
    <<: *app
    command: ["sh", "-c", "uv run ruff check . && uv run ruff format --check ."]

volumes:
  uv-cache:
