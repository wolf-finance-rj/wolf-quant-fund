# Ambiente de desenvolvimento do Wolf Quant Fund (Python 3.12 + uv).
# Principal: docker compose up -d app  |  docker compose exec app bash
# Checks:    docker compose run --rm checks
# Notebooks: docker compose --profile research up notebook
name: wolf-quant-fund

x-app: &app
  build:
    context: .
  image: wolf-quant-fund:dev
  working_dir: /app
  init: true
  env_file:
    # Carrega todas as variáveis do .env quando ele existir.
    - path: .env
      required: false
  environment:
    WQF_ENV: ${WQF_ENV:-development}
    # Caminho fixo dentro do container; o diretório é montado abaixo.
    WQF_DATA_DIR: /app/data
  volumes:
    # Repositório montado: edições locais valem no container sem rebuild.
    - .:/app
    # Dados e resultados ficam no host, fora da imagem.
    - ./data:/app/data
    # Cache do uv compartilhado entre execuções.
    - uv-cache:/root/.cache/uv

services:
  # Sandbox principal: `docker compose up -d app` e depois `docker compose exec app <cmd>`.
  app:
    <<: *app

  # Mesmos checks do CI (.github/workflows/ci.yml).
  test:
    <<: *app
    command: ["uv", "run", "pytest", "-q"]

  lint:
    <<: *app
    command: ["sh", "-c", "uv run ruff check . && uv run ruff format --check ."]

  # Um comando para rodar tudo o que o CI roda.
  checks:
    <<: *app
    command: ["sh", "-c", "uv run ruff check . && uv run ruff format --check . && uv run pytest -q"]

  # Jupyter opcional: docker compose --profile research up notebook
  notebook:
    <<: *app
    profiles: ["research"]
    command:
      - uv
      - run
      - --with
      - jupyterlab
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --no-browser
      - --ServerApp.token=${WQF_JUPYTER_TOKEN:-wqf}
    ports:
      # Só acessível da própria máquina.
      - "127.0.0.1:${WQF_JUPYTER_PORT:-8888}:8888"

volumes:
  uv-cache:
