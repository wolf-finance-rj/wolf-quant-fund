[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "wolf-quant-fund"
version = "0.1.0"
description = "Plataforma educacional de pesquisa quantitativa e simulação da Wolf Finance"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/wqf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
