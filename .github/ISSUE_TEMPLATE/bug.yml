name: Reportar bug
description: Registrar falha reproduzível
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problema observado
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências e logs (sem segredos)
