name: Deploy VPS (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wolf-quant-fund-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server4You
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"

      - name: Setup SSH (verified host key)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy verified main commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" -- "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA=$DEPLOY_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          cd /opt/wolf-quant-fund
          test "$(git remote get-url origin)" = "https://github.com/wolf-finance-rj/wolf-quant-fund.git"
          git fetch --prune origin main
          test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"
          git checkout --detach "$DEPLOY_SHA"
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml build app
          docker compose -f compose.yaml -f compose.prod.yaml up -d --no-deps app
          docker compose -f compose.yaml -f compose.prod.yaml ps app
          REMOTE
